name: bot-ci
on:
  push:
    paths:
      - "bot/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/bot-ci.yml"
  pull_request:
    paths:
      - "bot/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/bot-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
