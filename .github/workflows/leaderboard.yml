name: leaderboard
on:
  # Scheduled runs paused for now — re-enable by uncommenting the schedule block.
  # schedule:
  #   - cron: "0 7 * * 1"    # Mondays ~10:00 Europe/Riga
  workflow_dispatch:

jobs:
  leaderboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m bot leaderboard
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          RESULTS_CHANNEL_ID: ${{ secrets.RESULTS_CHANNEL_ID }}
          LEADERBOARD_CHANNEL_ID: ${{ secrets.LEADERBOARD_CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
